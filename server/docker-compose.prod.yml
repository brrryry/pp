version: '3.8'

services:
  redis:
    image: redis:alpine
    command: redis-server --bind 0.0.0.0
    ports:
      - "6380:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppdb}
      POSTGRES_USER: ${POSTGRES_USER:-ppuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pppassword}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppuser} -d ${POSTGRES_DB:-ppdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    pull_policy: build
    image: beatmap-recommender-web:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OSU_CLIENT_ID=${OSU_CLIENT_ID:-${OSU_API_CLIENT_ID}}
      - OSU_CLIENT_SECRET=${OSU_CLIENT_SECRET:-${OSU_API_CLIENT_SECRET}}
      - OSU_API_CLIENT_ID=${OSU_API_CLIENT_ID:-${OSU_CLIENT_ID}}
      - OSU_API_CLIENT_SECRET=${OSU_API_CLIENT_SECRET:-${OSU_CLIENT_SECRET}}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ppuser}:${POSTGRES_PASSWORD:-pppassword}@postgres:5432/${POSTGRES_DB:-ppdb}
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: python -m gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4 main:app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    pull_policy: build
    image: beatmap-recommender-worker:latest
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OSU_CLIENT_ID=${OSU_CLIENT_ID:-${OSU_API_CLIENT_ID}}
      - OSU_CLIENT_SECRET=${OSU_CLIENT_SECRET:-${OSU_API_CLIENT_SECRET}}
      - OSU_API_CLIENT_ID=${OSU_API_CLIENT_ID:-${OSU_CLIENT_ID}}
      - OSU_API_CLIENT_SECRET=${OSU_API_CLIENT_SECRET:-${OSU_CLIENT_SECRET}}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ppuser}:${POSTGRES_PASSWORD:-pppassword}@postgres:5432/${POSTGRES_DB:-ppdb}
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: rq worker replay_ingestion --url redis://redis:6379/0

  beatmap-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    pull_policy: build
    image: beatmap-recommender-beatmap-worker:latest
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OSU_CLIENT_ID=${OSU_CLIENT_ID:-${OSU_API_CLIENT_ID}}
      - OSU_CLIENT_SECRET=${OSU_CLIENT_SECRET:-${OSU_API_CLIENT_SECRET}}
      - OSU_API_CLIENT_ID=${OSU_API_CLIENT_ID:-${OSU_CLIENT_ID}}
      - OSU_API_CLIENT_SECRET=${OSU_API_CLIENT_SECRET:-${OSU_API_CLIENT_SECRET}}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ppuser}:${POSTGRES_PASSWORD:-pppassword}@postgres:5432/${POSTGRES_DB:-ppdb}
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: rq worker beatmap_ingestion --url redis://redis:6379/0

volumes:
  redis_data:
  postgres_data: