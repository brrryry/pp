version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount server data directory to persist database, replays, and logs
      - ./server/data:/app/server/data
    environment:
      - REDIS_URL=redis://redis-cache:6379
    depends_on:
      - redis-cache
    restart: always

  redis-cache:
    image: redis:alpine
    expose:
      - "6379"
    restart: always
